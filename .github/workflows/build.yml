name: Build CloudStream extension

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle Fojik:make

      - name: Inspect CS3
        run: |
          echo "=== MANIFEST ==="
          unzip -p Fojik/build/Fojik.cs3 manifest.json
          echo
          echo "=== CS3 FILE ==="
          file Fojik/build/Fojik.cs3

      - name: Prepare builds branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin builds || true

          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git checkout -B builds origin/builds
          else
            git checkout --orphan builds
            git rm -rf . || true
          fi

          cp "$GITHUB_WORKSPACE/Fojik/build/Fojik.cs3" ./Fojik.cs3
          cp "$GITHUB_WORKSPACE/plugins.json" ./plugins.json

          git add Fojik.cs3 plugins.json
          git commit -m "Update Fojik plugin" || true
          git push origin builds

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Fojik-build
          path: Fojik/build/
          if-no-files-found: error
