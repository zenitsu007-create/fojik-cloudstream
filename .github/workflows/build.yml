name: Build CloudStream extension

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle Fojik:make

      - name: Save build files
        run: |
          cp Fojik/build/Fojik.cs3 /tmp/Fojik.cs3
          cp plugins.json /tmp/plugins.json

      - name: Prepare builds branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin builds || true

          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git checkout -B builds origin/builds
          else
            git checkout --orphan builds
            git rm -rf . || true
          fi

          cp /tmp/Fojik.cs3 ./Fojik.cs3
          cp /tmp/plugins.json ./plugins.json

          git add Fojik.cs3 plugins.json
          git commit -m "Update Fojik plugin" || true
          git push origin builds
