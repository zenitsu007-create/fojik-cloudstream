name: Build CloudStream extension

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle Fojik:make

      - name: Inspect CS3
        run: |
          echo "=== CS3 FILE ==="
          file Fojik/build/*.cs3
          echo "=== CS3 CONTENTS ==="
          unzip -l Fojik/build/*.cs3

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Fojik-build
          path: Fojik/build/
          if-no-files-found: error
